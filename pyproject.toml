[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ebookmaker"
version = "2.0.0"
description = "从小说站点爬取正文、净化排版并生成 EPUB/MOBI/AZW3 电子书"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.10",
    "lxml>=4.9",
    "PyYAML>=6.0",
    "charset-normalizer>=3.0",
]

[project.optional-dependencies]
# 通用站点正文抽取兜底（缺失时自动降级为内置启发式）
extract = ["trafilatura>=1.6"]
# 加密字体站点自动解密（woff2 需 brotli）
font = ["fonttools>=4.40", "brotli>=1.0"]
# 小封面放大到 Kindle 可用分辨率（缺失则按原尺寸打包，不阻塞出书）
cover = ["Pillow>=9.0"]
dev = ["pytest>=7.0"]

[project.scripts]
ebookmaker = "ebookmaker.cli:main"

[tool.setuptools.packages.find]
include = ["ebookmaker*"]

[tool.setuptools.package-data]
ebookmaker = ["builders/*.css", "builders/*.jpg", "builders/*.xhtml"]
