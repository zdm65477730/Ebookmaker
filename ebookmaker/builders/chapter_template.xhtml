<!-- 章节正文模板：可自由修改布局与样式类名（$变量语法）。
     可用占位符：$$title 章标题  $$content 正文段落（已拼好的 <p class="indent"> 序列）
-->
<section class="chapter" epub:type="chapter">
  <header class="chapter-head">
    <div class="chap-ornament">&#10087;</div>
    <h1 class="chapter-title">$title</h1>
    <div class="chap-rule"></div>
  </header>
  <div class="chapter-body">
$content
  </div>
</section>
